models:
    - name: orders_t
      columns:
        - name: order_id
          data_tests:
            - not_null
            - unique
        - name: total_amount
          data_tests:
            - dbt_utils.accepted_range:
                min_value: 0
                inclusive: false
    - name: customers_t
      columns:
        - name: customer_id
          data_tests:
            - not_null
            - unique
    - name: employees_t
      columns:
        - name: employee_id
          data_tests:
            - not_null
            - unique
    - name: order_items_t
      columns:
        - name: order_item_id
          data_tests:
            - not_null
            - unique
        - name: line_amount
          data_tests:
            - dbt_utils.accepted_range:
                min_value: 0
                inclusive: false
    - name: products_t
      columns:
        - name: product_id
          data_tests:
            - not_null
            - unique
        - name: price
          data_tests:
            - dbt_utils.accepted_range:
                min_value: 0
                inclusive: true
    - name: stores_t
      columns:
        - name: store_id
          data_tests:
            - not_null
            - unique
